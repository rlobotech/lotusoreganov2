services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: game
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-game_dev_password}
      POSTGRES_DB: game
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U game -d game']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
